<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a href="./index.html">Go Back</a>
    <form class="feedback-form" autocomplete="off">
      <div class="feedback-form-label">
        <label class="feedback-form-label-email">
          Email
          <input
            class="feedback-form-email"
            type="email"
            name="email"
            autofocus
          />
        </label>
        <label class="feedback-form-label-message">
          Message
          <textarea
            class="feedback-form-message"
            name="message"
            rows="8"
          ></textarea>
        </label>
      </div>
      <button class="feedback-form-submit" type="submit">Submit</button>
    </form>

    <script type="module" src="./js/2-form.js"></script>
  </body>
</html>
